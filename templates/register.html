{% extends "base.html" %}

{% block title %}Register - Secure Digital Locker{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Register</h2>
    <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
            <small>Minimum 8 characters</small>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
        </div>
        <div class="form-group">
            <label for="pin">6-Digit Locker PIN</label>
            <input type="password" id="pin" name="pin" required pattern="[0-9]{6}" minlength="6" maxlength="6" inputmode="numeric">
            <small>Used to unlock documents. Must be exactly 6 digits.</small>
        </div>
        <div class="form-group">
            <label for="confirm_pin">Confirm Locker PIN</label>
            <input type="password" id="confirm_pin" name="confirm_pin" required pattern="[0-9]{6}" minlength="6" maxlength="6" inputmode="numeric">
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <p class="form-link">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
</div>
{% endblock %}
